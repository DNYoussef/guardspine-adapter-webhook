name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: guardspine-adapter-webhook
      - uses: actions/checkout@v4
        with:
          repository: DNYoussef/guardspine-kernel
          path: guardspine-kernel
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: guardspine-adapter-webhook/package-lock.json
      - name: Build kernel dependency
        run: |
          cd guardspine-kernel
          npm ci
          npm run build
      - name: Install and test
        working-directory: guardspine-adapter-webhook
        run: |
          npm ci
          npm install ../guardspine-kernel
          npx vitest run --pool=forks --exclude 'tests/polyglot/**'
