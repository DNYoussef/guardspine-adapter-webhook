name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DNYoussef/guardspine-kernel
          path: guardspine-kernel
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build kernel dependency
        run: |
          cd guardspine-kernel
          npm ci
          npm run build
      - run: npm ci
      - run: npm test
